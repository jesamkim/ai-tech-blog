<svg xmlns="http://www.w3.org/2000/svg" width="880" height="1176" viewBox="0 0 880 1176" font-family="'Noto Sans CJK KR', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FAFAFA"/>
    </linearGradient>
    <linearGradient id="accentBlack" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111111"/>
      <stop offset="1" stop-color="#333333"/>
    </linearGradient>
    <linearGradient id="dataBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6F9FF"/>
      <stop offset="1" stop-color="#EEF3FF"/>
    </linearGradient>
    <filter id="softShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feOffset in="SourceAlpha" dx="0" dy="2" result="soff"/>
      <feGaussianBlur in="soff" stdDeviation="3" result="sblur"/>
      <feColorMatrix in="sblur" type="matrix" result="sshade"
        values="0 0 0 0 0.04  0 0 0 0 0.04  0 0 0 0 0.05  0 0 0 0.10 0"/>
      <feMerge>
        <feMergeNode in="sshade"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowFlow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8C8C95"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#635BFF"/>
    </marker>
    <marker id="arrowStop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#DC2626"/>
    </marker>
    <marker id="arrowData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#B8C5E8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="1176" fill="#FFFFFF"/>

  <text x="32" y="44" font-size="26" font-weight="700" fill="#0A0A0A" letter-spacing="-0.5">물리 에이전트의 권한 게이트</text>
  <text x="32" y="72" font-size="15" fill="#6B6B75">의도에서 실행까지, 그리고 모델을 우회하는 정지 경로</text>
  <line x1="32" y1="92" x2="848" y2="92" stroke="#EAEAEA" stroke-width="1"/>

  <text x="56" y="140" font-size="12" font-weight="600" fill="#6B6B75" letter-spacing="0.08em">AGENT PATH</text>
  <text x="566" y="140" font-size="12" font-weight="600" fill="#DC2626" letter-spacing="0.08em">INDEPENDENT PATH</text>

  <!-- 1. intent -->
  <rect x="56" y="176" width="470" height="64" rx="12" fill="url(#accentBlack)" stroke="#000000" stroke-width="1" filter="url(#softShadow)"/>
  <text x="76" y="204" font-size="16" font-weight="600" fill="#FFFFFF">에이전트 의도</text>
  <text x="76" y="224" font-size="13" fill="#A0A0AA">장치 조작 요청</text>
  <line x1="291" y1="240" x2="291" y2="270" stroke="#8C8C95" stroke-width="1.5" marker-end="url(#arrowFlow)"/>

  <!-- 2. whitelist -->
  <rect x="56" y="274" width="470" height="64" rx="10" fill="url(#cardBg)" stroke="#E5E5EA" stroke-width="1" filter="url(#softShadow)"/>
  <text x="76" y="302" font-size="16" font-weight="600" fill="#0A0A0A">capability 화이트리스트</text>
  <text x="76" y="322" font-size="13" fill="#6B6B75">기본값은 거부, 허용은 열거로만</text>
  <line x1="291" y1="338" x2="291" y2="368" stroke="#8C8C95" stroke-width="1.5" marker-end="url(#arrowFlow)"/>

  <!-- 3. risk classification -->
  <rect x="56" y="372" width="470" height="64" rx="10" fill="url(#cardBg)" stroke="#E5E5EA" stroke-width="1" filter="url(#softShadow)"/>
  <text x="76" y="400" font-size="16" font-weight="600" fill="#0A0A0A">위험 등급 분류</text>
  <text x="76" y="420" font-size="13" fill="#6B6B75">관측, 구동, 안전 관련</text>
  <line x1="291" y1="436" x2="291" y2="466" stroke="#8C8C95" stroke-width="1.5" marker-end="url(#arrowFlow)"/>

  <!-- 4. per-class gates -->
  <rect x="56" y="470" width="470" height="240" rx="12" fill="url(#dataBg)" stroke="#D6DFF5" stroke-width="1"/>
  <text x="76" y="496" font-size="14" font-weight="600" fill="#3B4FCC">등급별 게이트</text>

  <rect x="76" y="508" width="430" height="54" rx="8" fill="#FFFFFF" stroke="#D6DFF5" stroke-width="1"/>
  <text x="92" y="530" font-size="14" font-weight="600" fill="#0A0A0A">관측 (read)</text>
  <text x="92" y="550" font-size="12" fill="#6B6B75">관측 예산 한도 확인</text>

  <rect x="76" y="574" width="430" height="54" rx="8" fill="#FFFFFF" stroke="#D6DFF5" stroke-width="1"/>
  <text x="92" y="596" font-size="14" font-weight="600" fill="#0A0A0A">구동 (actuate)</text>
  <text x="92" y="616" font-size="12" fill="#6B6B75">사전 조건 검사, dry-run 또는 셀 시뮬레이션</text>

  <rect x="76" y="640" width="430" height="54" rx="8" fill="#FFFFFF" stroke="#DC2626" stroke-width="1"/>
  <text x="92" y="662" font-size="14" font-weight="600" fill="#0A0A0A">안전 관련 (safety-critical)</text>
  <text x="92" y="682" font-size="12" fill="#6B6B75">사람 승인 또는 거부, 장치 쪽 선언으로 고정</text>

  <line x1="291" y1="710" x2="291" y2="740" stroke="#635BFF" stroke-width="1.5" marker-end="url(#arrowAccent)"/>

  <!-- 5. device-declared bounds -->
  <rect x="56" y="744" width="470" height="64" rx="10" fill="#FFFFFF" stroke="#635BFF" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="76" y="772" font-size="16" font-weight="600" fill="#0A0A0A">장치 선언 한계 강제</text>
  <text x="76" y="792" font-size="13" fill="#6B6B75">하드웨어 인터페이스, 모델 바깥</text>
  <line x1="291" y1="808" x2="291" y2="838" stroke="#8C8C95" stroke-width="1.5" marker-end="url(#arrowFlow)"/>

  <!-- 6. execute -->
  <rect x="56" y="842" width="470" height="64" rx="10" fill="url(#cardBg)" stroke="#E5E5EA" stroke-width="1" filter="url(#softShadow)"/>
  <text x="76" y="870" font-size="16" font-weight="600" fill="#0A0A0A">실행</text>
  <text x="76" y="890" font-size="13" fill="#6B6B75">구동 명령 전달</text>
  <line x1="291" y1="906" x2="291" y2="936" stroke="#8C8C95" stroke-width="1.5" marker-end="url(#arrowFlow)"/>

  <!-- independent stop path -->
  <rect x="566" y="176" width="258" height="104" rx="10" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.5" filter="url(#softShadow)"/>
  <text x="586" y="208" font-size="15" font-weight="600" fill="#DC2626">emergency stop, 인터록</text>
  <text x="586" y="232" font-size="12" fill="#6B6B75">사람 조작과 안전 회로</text>
  <text x="586" y="252" font-size="12" fill="#6B6B75">에이전트 경로와 물리적 분리</text>
  <line x1="695" y1="280" x2="695" y2="932" stroke="#DC2626" stroke-width="1.8" marker-end="url(#arrowStop)"/>
  <text x="712" y="440" font-size="12" font-weight="600" fill="#DC2626">모델 판단을</text>
  <text x="712" y="460" font-size="12" font-weight="600" fill="#DC2626">거치지 않습니다</text>
  <text x="712" y="496" font-size="12" fill="#6B6B75">정지가 걸린 상태에서는</text>
  <text x="712" y="516" font-size="12" fill="#6B6B75">구동 명령이 거부됩니다</text>

  <!-- device band -->
  <rect x="56" y="940" width="768" height="72" rx="12" fill="url(#dataBg)" stroke="#D6DFF5" stroke-width="1" filter="url(#softShadow)"/>
  <text x="440" y="972" font-size="17" font-weight="600" fill="#0A0A0A" text-anchor="middle">물리 장치</text>
  <text x="440" y="994" font-size="13" fill="#3B4FCC" text-anchor="middle">로봇팔, 액체 핸들러, 레이저</text>

  <line x1="291" y1="1012" x2="291" y2="1042" stroke="#B8C5E8" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowData)"/>
  <text x="308" y="1032" font-size="12" fill="#6B6B75">명령과 센서값을 함께</text>

  <!-- trajectory audit -->
  <rect x="56" y="1046" width="768" height="76" rx="12" fill="url(#cardBg)" stroke="#E5E5EA" stroke-width="1" filter="url(#softShadow)"/>
  <text x="440" y="1078" font-size="16" font-weight="600" fill="#0A0A0A" text-anchor="middle">궤적 감사 기록</text>
  <text x="440" y="1100" font-size="13" fill="#6B6B75" text-anchor="middle">명령, 주체, 근거 관측값, 실행 시점의 장치 상태, 결과</text>

  <text x="32" y="1156" font-size="11" fill="#B0B0B8">jesamkim.github.io</text>
</svg>
